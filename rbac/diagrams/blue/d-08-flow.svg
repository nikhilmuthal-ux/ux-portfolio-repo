<text x="768" y="370" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif"><tspan font-size="17" font-weight="700" fill="#14213D">Entity type</tspan><tspan dx="14" font-size="13.5" fill="#52607A">Domains / Machines / Agents / Installations</tspan></text>
<rect x="764" y="396" width="504" height="156" rx="14" fill="#FDE6DF" stroke="#F4A08F" stroke-width="1.3"/>
<text x="790" y="436" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif"><tspan font-size="17" font-weight="700" fill="#A93A25">Instance</tspan><tspan dx="14" font-size="13.5" fill="#52607A"></tspan></text>
<rect x="790" y="461" width="106" height="22" rx="11" fill="#FFFFFF" stroke="#F4A08F"/>
<text x="843.0" y="476" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#C2452D" text-anchor="middle" letter-spacing="0.8">FINEST SCOPE</text>
<text x="790" y="512" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52607A" text-anchor="start">Read or Write comes from the role</text>
<text x="700" y="654" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#33415C" text-anchor="middle">Access at any level covers everything below it. Never above, never sideways.</text>

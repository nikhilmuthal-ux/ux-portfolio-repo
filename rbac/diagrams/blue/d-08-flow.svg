<svg viewBox="0 0 1400 700" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The containment model. A subscription, with the Owner, holds data planes; Teams group people and pass their grants to members. Each data plane has a Data Plane Manager, the same for all types. Inside a Kubernetes data plane: capability, then namespace, which gives team isolation, then application. Inside an on prem data plane: product, then entity type, then instance, the finest scope, where the role decides Read or Write. Access at any level covers everything below it, never above, never sideways." xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1400" height="700" fill="#FFFFFF"/>
<rect x="30" y="20" width="1340" height="660" rx="18" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1.3"/>
<rect x="60" y="44" width="150" height="38" rx="10" fill="#14213D"/>
<text x="135" y="68.5" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Subscription</text>
<text x="226" y="68.5" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52607A" text-anchor="start">Owner</text>
<rect x="60" y="100" width="1280" height="52" rx="12" fill="#FFFFFF" stroke="#93B4F5" stroke-width="1.3" stroke-dasharray="5 5"/>
<text x="84" y="132" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif"><tspan font-size="15" font-weight="700" fill="#1D4ED8">Teams</tspan><tspan dx="14" font-size="13.5" fill="#52607A">Group people; their grants flow to members</tspan></text>
<rect x="60" y="170" width="1280" height="450" rx="14" fill="#F5F8FC" stroke="#E3E9F2" stroke-width="1.3"/>
<text x="88" y="210" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif"><tspan font-size="17" font-weight="700" fill="#14213D">Data Plane</tspan><tspan dx="14" font-size="13.5" fill="#52607A">Data Plane Manager, same for all types</tspan></text>
<text x="88" y="252" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="start" letter-spacing="2">IF KUBERNETES</text>
<text x="720" y="252" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#C2452D" text-anchor="start" letter-spacing="2">IF ON PREM</text>
<rect x="88" y="266" width="592" height="330" rx="14" fill="#F3F7FF" stroke="#D3E1FB" stroke-width="1.3"/>
<text x="114" y="306" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif"><tspan font-size="17" font-weight="700" fill="#14213D">Capability</tspan><tspan dx="14" font-size="13.5" fill="#52607A">BWCE / Flogo / BW5CE / DevHub</tspan></text>
<rect x="110" y="330" width="548" height="244" rx="14" fill="#E6EFFE" stroke="#BFD3FA" stroke-width="1.3"/>
<text x="136" y="370" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif"><tspan font-size="17" font-weight="700" fill="#14213D">Namespace</tspan><tspan dx="14" font-size="13.5" fill="#52607A">One marked Primary</tspan></text>
<rect x="514" y="351" width="120" height="22" rx="11" fill="#FFFFFF" stroke="#BFD3FA"/>
<text x="574.0" y="366" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="0.8">TEAM ISOLATION</text>
<rect x="132" y="396" width="504" height="156" rx="14" fill="#DCE8FD" stroke="#93B4F5" stroke-width="1.3"/>
<text x="158" y="436" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif"><tspan font-size="17" font-weight="700" fill="#1D4ED8">Application</tspan><tspan dx="14" font-size="13.5" fill="#52607A"></tspan></text>
<rect x="158" y="461" width="57" height="22" rx="11" fill="#FFFFFF" stroke="#BFD3FA"/>
<text x="186.5" y="476" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="0.8">SCOPE</text>
<text x="158" y="512" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52607A" text-anchor="start">The finest place on Kubernetes</text>
<rect x="720" y="266" width="592" height="330" rx="14" fill="#FFF8F6" stroke="#FAD9D1" stroke-width="1.3"/>

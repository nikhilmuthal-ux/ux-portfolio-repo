rial, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#52607A">Control Plane</text><rect x="75" y="160" width="210" height="58" rx="10" fill="#E6EFFE" stroke="#2563EB" stroke-width="1.4"></rect><text x="180" y="185" text-anchor="middle" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14213D">Kubernetes Data Planes</text><text x="180" y="203" text-anchor="middle" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="9" font-style="italic" fill="#64748B">BWCE · BW5CE · Flogo · DevHub</text><text x="180" y="336" text-anchor="middle" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#52607A">platform tasks only</text><text x="180" y="352" text-anchor="middle" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#52607A">no resource level permission</text><rect x="395" y="146" width="220" height="54" rx="10" fill="#E6EFFE" stroke="#2563EB" stroke-width="1.4"></rect><text x="505" y="169" text-anchor="middle" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14213D">Kubernetes Data Planes</text><text x="505" y="186" text-anchor="middle" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="9" font-style="italic" fill="#64748B">BWCE · BW5CE · Flogo · DevHub</text><rect x="395" y="222" width="220" height="54" rx="10" fill="#FFF1EE" stroke="#14213D" stroke-width="1.4"></rect><text x="505" y="245" text-anchor="middle" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14213D">On Prem Data Planes</text><text x="505" y="262" text-anchor="middle" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="9" font-style="italic" fill="#64748B">BW5 · BW6 · EMS</text><text x="505" y="336" text-
<svg viewBox="0 0 1400 735" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Assigning access, before and now. Control Plane v1 used three steps: Users, Permissions with scope, Preview. Now there are four: Who, Where, Role, Review. Add permission starts at Who. A data plane page starts at Who with where filled in. A person or team page starts at Where with who filled in. Choosing Whole organization skips Role, since Owner is the only role. A grant is who plus where plus role, and shows its source: Direct or From a team." xmlns:c2pa="http://c2pa.org/manifest">

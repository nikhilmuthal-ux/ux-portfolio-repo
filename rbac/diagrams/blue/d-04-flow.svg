<text x="92" y="59" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#14213D" text-anchor="start" letter-spacing="2">PLATFORM LEVEL · PEOPLE AND PERMISSIONS</text>
<rect x="175.0" y="80.0" width="270" height="96" rx="10" fill="#F5F8FC"/>
<text x="310" y="115.0" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">Full administration</text>
<text x="310" y="135.0" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52607A" text-anchor="middle">Users, groups, teams, permissions</text>
<text x="310" y="152.0" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52607A" text-anchor="middle">SSO and organization settings</text>

<svg viewBox="0 0 1400 610" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The role and functionality matrix. Platform level: full administration maps to Owner, scoped administration without SSO to Data Plane Manager, view and request to Capability Manager, view only with requests to Viewer. Resource level, granted per place: Owner runs everything everywhere, Data Plane Manager runs data planes, capabilities, applications and product entities on their data planes, Capability Manager runs capabilities and apps and modifies product entities in the places picked, Viewer views everything in scope. The four roles are fixed and the role decides Read or Write." xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="fa" markerWidth="10" markerHeight="10" refX="8.5" refY="4.5" orient="auto"><path d="M0.5,0.5 L9,4.5 L0.5,8.5 L3,4.5 Z" fill="#B4C2D6"/></marker><marker id="fb" markerWidth="10" markerHeight="10" refX="8.5" refY="4.5" orient="auto"><path d="M0.5,0.5 L9,4.5 L0.5,8.5 L3,4.5 Z" fill="#93B4F5"/></marker><marker id="fc" markerWidth="10" markerHeight="10" refX="8.5" refY="4.5" orient="auto"><path d="M0.5,0.5 L9,4.5 L0.5,8.5 L3,4.5 Z" fill="#F4A08F"/></marker><pattern id="fdot" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1.2" fill="#EEF2F8"/></pattern></defs>

le</text><text x="156" y="386" text-anchor="middle" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#64748B">per product · per entity type or instance</text><text x="566" y="78" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="12.5" fill="#14213D">Register / manage / remove on prem data planes</text><text x="566" y="114" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="12.5" fill="#14213D">View machines, metrics, non K8s applications</text><text x="566" y="150" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="12.5" fill="#14213D">View Domains</text><text x="566" y="186" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="12.5" fill="#14213D">View Machines</text><text x="566" y="222" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="12.5" fill="#14213D">View Agents</text><text x="566" y="258" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="12.5" fill="#14213D">View Installations</text><text x="566" y="294" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="12.5" fill="#14213D">Modify Domains</text><text x="566" y="330" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="12.5" fill="#14213D">Modify Machines</text><text x="566" y="366" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="12.5" fill="#14213D">Modify Agents</text><text x="566" y="402" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="12.5" fill="#14213D">Modify Installations</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
<svg viewBox="0 0 880 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The whole idea in one picture. The Control Plane container holds both data plane types: Kubernetes data planes with the capabilities BWCE, BW5CE, Flogo, and DevHub, and on-prem data planes running BW5, BW6, and EMS. The Control Plane itself carries the platform tasks; the two worlds carry the resource level tasks; and RBAC is their sum: one user management for both." xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="th-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#52607A" opacity="0.85"></path></marker></defs><text x="440" y="40" text-anchor="middle" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="2" fill="#52607A">Platform tasks</text><path d="M440,118 L440,62" fill="none" stroke="#52607A" stroke-width="1.4" opacity="0.7" marker-end="url(#th-ar)"></path><rect x="180" y="120" width="520" height="170" rx="10" fill="#ffffff" stroke="#C3CEDD" stroke-width="2"></rect><text x="204" y="150" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#52607A">Control Plane</text><rect x="210" y="168" width="220" height="84" rx="10" fill="#E6EFFE" stroke="#2563EB" stroke-width="1.5"></rect><text x="320" y="206" text-anchor="middle" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#14213D">Kubernetes Data Planes</text><text x="320" y="228" text-anchor="middle" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#64748B">BWCE · BW5CE · Flogo · DevHub</text><rect x="450" y="168" width="230" height="84" rx="10" fill="#FFF1EE" stroke="#14213D" stroke-width="1.5"></rect><text x="565" y="206" text-anchor="middle" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#14213D">On Prem Data Planes</text><text x="565" y="228" text-anchor="middle" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#64748B">BW5 · BW6 · EMS</text><path d="M320,254 C320,292 400,296 428,306" fill="none" stroke="#2563EB" stroke-width="1.4" opacity="0.55"></path><path d="M565,254 C565,292 480,296 452,306" fill="none" stroke="#14213D" stroke-width="1.4" opacity="0.55"></path><path d="M440,306 L440,330" fill="none" stroke="#52607A" stroke-width="1.4" opacity="0.7" marker-end="url(#th-ar)"></path><text x="440" y="356" text-anchor="middle" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="2" fill="#2563EB">Resource level tasks</text><text x="440" y="392" text-anchor="middle" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#52607A">Both worlds, streamlined into one user management</text><text x="440" y="428" text-anchor="middle" font-family="Plus Jakarta Sans, Archivo, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#14213D">RBAC  =  Platform Tasks  +  Resource Tasks</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>